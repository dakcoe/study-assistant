# 네 가지 빌드를 한 번에 만든다.
#
#   macOS Apple Silicon (arm64)   macos-14 러너
#   macOS Intel (x86_64)          macos-13 러너
#   Windows x64                   windows-latest
#   Windows ARM64                 windows-11-arm
#
# 하나로 합친 유니버설 맥 앱은 못 만든다 — numpy 2.x가 universal2 휠을 내지
# 않아 아키텍처별로 따로 빌드해야 한다.
#
# 손으로 실행하면 Artifacts에 올라가고, v1.0.0 같은 태그를 밀면 Releases에
# 파일이 붙는다.
name: 빌드

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            label: Apple Silicon
            slug: AppleSilicon
          # macos-13은 애플이 인텔을 접으면서 러너가 줄어 몇십 분씩 대기만 한다.
          # macos-15-intel이 지금 쓰는 인텔 러너다.
          - runner: macos-15-intel
            arch: x86_64
            label: Intel
            slug: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 테스트
        run: python tests/test_studyai.py

      # ScreenCaptureKit 오디오 탭은 macOS 13부터라 타깃을 13으로 잡는다.
      - name: Swift 헬퍼 컴파일
        run: swiftc -O -target ${{ matrix.arch }}-apple-macos13 app/audio_capture.swift -o app/audio_capture

      - name: 빌드
        run: python -m PyInstaller --noconfirm --clean packaging/StudyAI.spec

      # 한국어 번들로 인식시켜야 저장 패널이 한국어로 뜬다.
      - name: 한국어 번들 + 서명
        run: |
          APP="dist/Study AI.app"
          mkdir -p "$APP/Contents/Resources/ko.lproj"
          printf '"CFBundleName" = "Study AI";\n"CFBundleDisplayName" = "Study AI";\n' \
            > "$APP/Contents/Resources/ko.lproj/InfoPlist.strings"
          codesign -f -s - -i com.superbleo.studyai.audiocapture "$APP/Contents/Frameworks/audio_capture"
          codesign -f -s - -i com.superbleo.studyai --deep "$APP"

      - name: 아키텍처 확인
        run: |
          got=$(lipo -archs "dist/Study AI.app/Contents/MacOS/StudyAI")
          echo "본체: $got"
          [ "$got" = "${{ matrix.arch }}" ] || { echo "::error::${{ matrix.arch }} 가 아니라 $got"; exit 1; }

      - name: dmg 만들기
        run: |
          STAGE=$(mktemp -d)
          cp -R "dist/Study AI.app" "$STAGE/"
          cp packaging/guide-mac.html "$STAGE/시작하기.html"
          ln -s /Applications "$STAGE/Applications"
          # "Resource busy"로 한 번씩 실패한다 — 임시 폴더를 다른 프로세스가
          # 잡고 있는 동안이라, 잠깐 쉬었다 다시 하면 된다.
          for try in 1 2 3; do
            hdiutil create -volname "Study AI" -srcfolder "$STAGE" -ov -format UDZO \
                           -imagekey zlib-level=9 "StudyAI-macOS-${{ matrix.slug }}.dmg" && break
            echo "dmg 생성 실패 ($try/3) — 15초 뒤 다시"
            sleep 15
          done
          test -f "StudyAI-macOS-${{ matrix.slug }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: "*.dmg"

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 테스트
        run: python tests/test_studyai.py

      - name: 빌드
        run: python -m PyInstaller --noconfirm --clean packaging/StudyAI-win.spec

      - name: 안내문 넣기
        shell: pwsh
        run: Copy-Item "packaging/guide-windows.html" "dist/StudyAI/시작하기.html"

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ matrix.arch }}
          path: dist/StudyAI

  release:
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: 윈도우 빌드는 zip으로 묶는다
        run: |
          cd out
          for d in Windows-*; do (cd "$d" && zip -qr "../StudyAI-$d.zip" .); done
          ls -R . | head -20

      - uses: softprops/action-gh-release@v2
        with:
          # 받는 사람이 어떤 파일을 골라야 하는지가 맨 위에 오게 한다.
          # 아래에 커밋 목록이 자동으로 붙는다.
          generate_release_notes: true
          body: |
            ### 어떤 파일을 받아야 하나요?

            | 쓰는 컴퓨터 | 받을 파일 |
            |---|---|
            | 맥 (2020년 이후 · M1~M4) | `StudyAI-macOS-AppleSilicon.dmg` |
            | 맥 (2020년 이전 · 인텔) | `StudyAI-macOS-Intel.dmg` |
            | 윈도우 | `StudyAI-Windows-x64.zip` |
            | 윈도우 (ARM 노트북) | `StudyAI-Windows-arm64.zip` |

            맥 사양은 왼쪽 위 사과 → **이 Mac에 관하여**에서 확인합니다.
            `Apple M…`이라고 쓰여 있으면 Apple Silicon입니다.
            윈도우는 **설정 → 시스템 → 정보 → 시스템 종류**를 봅니다.

            ### 설치

            파일 안에 **시작하기.html** 이 같이 들어 있습니다. 두 번 누르면
            브라우저로 열리고, 설치부터 API 키 넣기까지 네 단계로 안내합니다.

            처음 열 때 나오는 보안 경고는 개발자 등록을 하지 않은 앱이라
            나오는 것입니다. 한 번만 허용하면 그 뒤로는 그냥 열립니다.

            자세한 내용은 [README](https://github.com/dakcoe/study-assistant#readme)에 있습니다.

            ---
          files: |
            out/**/*.dmg
            out/*.zip
